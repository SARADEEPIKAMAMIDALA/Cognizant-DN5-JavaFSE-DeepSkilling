<h2>Enrollment Request (Template-Driven Form)</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

  <div class="field">
    <label>Student Name</label>
    <input name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel">
    <div class="errors" *ngIf="nameCtrl.touched && nameCtrl.invalid">
      <span *ngIf="nameCtrl.errors?.['required']">Name is required</span>
      <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters</span>
    </div>
  </div>

  <div class="field">
    <label>Student Email</label>
    <input name="studentEmail" type="email" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel">
    <div class="errors" *ngIf="emailCtrl.touched && emailCtrl.invalid">
      <span *ngIf="emailCtrl.errors?.['required']">Email is required</span>
      <span *ngIf="emailCtrl.errors?.['email']">Enter a valid email</span>
    </div>
  </div>

  <div class="field">
    <label>Course ID</label>
    <input name="courseId" type="number" [(ngModel)]="courseId" required #courseCtrl="ngModel">
    <div class="errors" *ngIf="courseCtrl.touched && courseCtrl.invalid">
      <span *ngIf="courseCtrl.errors?.['required']">Course ID is required</span>
    </div>
  </div>

  <div class="field">
    <label>Preferred Semester</label>
    <select name="preferredSemester" [(ngModel)]="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div class="field checkbox">
    <label>
      <input name="agreeToTerms" type="checkbox" [(ngModel)]="agreeToTerms" required #termsCtrl="ngModel">
      I agree to the terms
    </label>
  </div>

  <div class="actions">
    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="enrollForm.resetForm()">Reset</button>
  </div>

  <div class="success" *ngIf="submitted">Enrollment request submitted successfully!</div>
</form>
