<h2>Course Listing</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" placeholder="Search courses..." name="search">

<p *ngIf="isLoading$ | async">Loading courses...</p>
<p *ngIf="error$ | async as err" class="error">{{ err }}</p>

<div *ngFor="let course of (courses$ | async); let i = index; trackBy: trackByCourseId" (click)="openCourse(course)">
  <app-course-card
    [course]="course"
    (enrollRequested)="onEnroll($event)">
  </app-course-card>
</div>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
