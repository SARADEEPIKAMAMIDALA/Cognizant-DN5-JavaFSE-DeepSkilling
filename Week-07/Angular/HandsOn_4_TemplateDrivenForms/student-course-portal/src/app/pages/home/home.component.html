<h1>{{ portalName }}</h1>
<p>Welcome back! Here is a quick snapshot of your academic progress.</p>

<div class="stats-row">
  <div class="stat"><span class="value">12</span><span class="label">Courses Available</span></div>
  <div class="stat"><span class="value">3</span><span class="label">Enrolled</span></div>
  <div class="stat"><span class="value">3.8</span><span class="label">GPA</span></div>
</div>

<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p *ngIf="message">{{ message }}</p>

<div class="search-box">
  <input [(ngModel)]="searchTerm" placeholder="Search courses...">
  <p>Searching for: {{ searchTerm }}</p>
</div>
