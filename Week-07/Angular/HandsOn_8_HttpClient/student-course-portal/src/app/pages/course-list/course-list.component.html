<h2>Course Listing</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" placeholder="Search courses..." name="search">

<p *ngIf="isLoading">Loading courses...</p>
<p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

<ng-container *ngIf="!isLoading && !errorMessage">
  <ng-container *ngIf="courses.length; else noCourses">
    <div *ngFor="let course of courses; let i = index; trackBy: trackByCourseId" (click)="openCourse(course)">
      <app-course-card
        [course]="course"
        (enrollRequested)="onEnroll($event)">
      </app-course-card>
    </div>
  </ng-container>
  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</ng-container>

<p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
